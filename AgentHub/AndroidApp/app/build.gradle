plugins {
    id "com.android.application"
}

def hubUrl = providers.gradleProperty("agentHubUrl").orElse("").get()
def escapedHubUrl = hubUrl.replace("\\", "\\\\").replace('"', '\\"')
def agentHubVersionCode = providers.gradleProperty("agentHubVersionCode").orElse("2").get().toInteger()
def agentHubVersionName = providers.gradleProperty("agentHubVersionName").orElse("0.2.0").get()

android {
    namespace "app.agenthub.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "app.agenthub.mobile"
        minSdk 26
        targetSdk 36
        versionCode agentHubVersionCode
        versionName agentHubVersionName
        buildConfigField "String", "AGENT_HUB_URL", "\"${escapedHubUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
