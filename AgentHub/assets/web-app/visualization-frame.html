<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; frame-src data:; img-src data: blob:; media-src data: blob:; worker-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://esm.sh https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com https://fonts.bunny.net https://persistent.oaistatic.com/plugins/visualize/; style-src 'unsafe-inline' https://cdnjs.cloudflare.com https://esm.sh https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com https://fonts.bunny.net https://persistent.oaistatic.com/plugins/visualize/; font-src data: https://fonts.gstatic.com https://fonts.bunny.net">
  <title>Визуализация</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    iframe { display: block; border: 0; width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <script>
    let artifact;
    window.addEventListener("message", (event) => {
      if (artifact && event.source === artifact.contentWindow && event.origin === "null"
        && event.data?.kind === "agent-hub-visualization-size" && Number.isFinite(event.data.height)) {
        parent.postMessage({ kind: event.data.kind, height: event.data.height }, "*");
        return;
      }
      if (artifact || parent === window || event.source !== parent
        || event.data?.kind !== "agent-hub-visualization-content") return;
      const { url, title } = event.data;
      if (typeof url !== "string" || url.length > 1_350_000
        || !url.startsWith("data:text/html;charset=utf-8;base64,")) return;
      artifact = document.createElement("iframe");
      artifact.setAttribute("sandbox", "allow-scripts");
      artifact.referrerPolicy = "no-referrer";
      artifact.title = typeof title === "string" ? title : "Визуализация";
      artifact.src = url;
      document.body.append(artifact);
    });
  </script>
</body>
</html>
