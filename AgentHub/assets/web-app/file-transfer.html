<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Получение файла</title>
  <link rel="stylesheet" href="/transfer/styles.css">
  <script src="/transfer/app.js" defer></script>
</head>
<body>
  <main class="transfer-shell">
    <section class="transfer-card" aria-labelledby="transfer-title" aria-describedby="transfer-message">
      <div class="transfer-mark" aria-hidden="true">AH</div>
      <p class="transfer-eyebrow">Agent Hub</p>
      <h1 id="transfer-title">Получение файла</h1>
      <p id="transfer-message" class="transfer-message" role="status" aria-live="polite">Проверяем ссылку…</p>
      <div id="transfer-file" class="transfer-file" hidden>
        <strong id="transfer-name"></strong>
        <span id="transfer-size"></span>
        <span id="transfer-expiry"></span>
      </div>
      <p id="transfer-warning" class="transfer-warning" hidden></p>
      <div id="transfer-progress-wrap" class="transfer-progress" hidden>
        <div class="transfer-progress-track"><span id="transfer-progress-bar"></span></div>
        <span id="transfer-progress-label"></span>
      </div>
      <div class="transfer-actions">
        <button id="transfer-primary" type="button" class="primary" hidden></button>
        <button id="transfer-secondary" type="button" hidden></button>
      </div>
      <p id="transfer-alert" class="transfer-alert" role="alert" hidden></p>
    </section>
  </main>
</body>
</html>
